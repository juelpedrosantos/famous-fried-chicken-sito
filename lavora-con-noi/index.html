<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lavora con noi | Famous Fried Chicken Latina</title>
  <meta name="description" content="Candidati per lavorare da Famous Fried Chicken a Latina.">
  <meta name="theme-color" content="#aa191e">
  <link rel="icon" href="../assets/img/brand/mascot.png">
  <link rel="stylesheet" href="../assets/css/brand.css">
  <link rel="stylesheet" href="../assets/css/forms.css">
</head>
<body class="tray-pattern">
  <header class="f-header">
    <div class="container f-header__inner">
      <a class="f-back" href="../index.html">← Home</a>
      <a href="../index.html" aria-label="Famous Fried Chicken, torna alla home"><img class="f-logo" src="../assets/img/brand/wordmark.png" alt="" width="900" height="357"></a>
    </div>
  </header>
  <main class="container f-main">
    <section class="f-card">
      <h1 class="display f-title">Lavora con <span class="script accent">noi</span></h1>
      <p class="f-intro">Cerchiamo persone con energia e voglia di fare. Raccontaci chi sei: ti ricontattiamo noi.</p>
      <form class="f-form" action="https://formsubmit.co/info@famouslatina.com" method="POST">
        <input type="hidden" name="_subject" value="Nuova candidatura - Lavora con noi">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_next" value="https://famousfriedchicken.it/grazie/">
        <input type="text" name="_honey" class="f-honey" tabindex="-1" autocomplete="off" aria-hidden="true">
        <label class="f-field"><span class="f-label">Nome e cognome <span aria-hidden="true">*</span></span>
          <input class="f-input" type="text" name="Nome" autocomplete="name" required></label>
        <label class="f-field"><span class="f-label">Email <span aria-hidden="true">*</span></span>
          <input class="f-input" type="email" name="Email" autocomplete="email" required></label>
        <label class="f-field"><span class="f-label">Telefono <span aria-hidden="true">*</span></span>
          <input class="f-input" type="tel" name="Telefono" autocomplete="tel" required></label>
        <label class="f-field"><span class="f-label">Ruolo che ti interessa <span aria-hidden="true">*</span></span>
          <select class="f-input" name="Ruolo" required><option value="">Seleziona</option><option>Cucina</option><option>Sala</option><option>Cassa</option><option>Altro</option></select></label>
        <label class="f-field"><span class="f-label">Disponibilità <span aria-hidden="true">*</span></span>
          <select class="f-input" name="Disponibilita" required><option value="">Seleziona</option><option>Full time</option><option>Part time</option><option>Solo weekend</option></select></label>
        <label class="f-field"><span class="f-label">Città di residenza</span>
          <input class="f-input" type="text" name="Citta" autocomplete="address-level2"></label>
        <label class="f-field"><span class="f-label">Messaggio</span>
          <textarea class="f-input" name="Messaggio" rows="4" maxlength="2000"></textarea></label>
        <label class="f-check"><input type="checkbox" name="Consenso privacy" value="Sì" required>
          <span>Acconsento al trattamento dei miei dati personali per essere ricontattato da Famous Fried Chicken (STAR S.R.L.) in merito a questa richiesta (<a href="../privacy/" target="_blank" rel="noopener">informativa privacy</a>). <span aria-hidden="true">*</span></span></label>
        <button class="btn f-submit" type="submit">Invia la richiesta</button>
        <p class="f-note">I campi con * sono obbligatori. La richiesta arriva direttamente al locale.</p>
      </form>
    </section>
  </main>
</body>
</html>
